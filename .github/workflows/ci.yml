name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # x64 with PCLMULQDQ, arm64 with PMULL
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release --logger "trx;LogFilePrefix=${{ matrix.os }}" --results-directory TestResults

      - name: Pack
        if: matrix.os == 'ubuntu-latest'
        run: dotnet pack src/UA.Cryptography --no-build -c Release -o artifacts

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.os }}
          path: |
            TestResults
            artifacts
          if-no-files-found: ignore
