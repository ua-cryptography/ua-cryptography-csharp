name: Release

# Publishes UA.Cryptography and UA.Cryptography.Pki when a version tag (v1.2.3, v1.2.3-beta.1) is pushed:
# to nuget.org, to GitHub Packages, and as a GitHub release with the packages attached.
# nuget.org authentication uses Trusted Publishing: no API key is stored in the repository.
# Every push uses --skip-duplicate, so a failed run can be re-run after a partial publish.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
      packages: write # push to GitHub Packages
      id-token: write # OIDC token exchanged for a short-lived nuget.org API key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release -p:Version=$VERSION

      - name: Test
        run: dotnet test --no-build -c Release

      - name: Pack
        run: |
          dotnet pack src/UA.Cryptography --no-build -c Release -p:Version=$VERSION -o artifacts
          dotnet pack src/UA.Cryptography.Pki --no-build -c Release -p:Version=$VERSION -o artifacts

      - uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      # The .snupkg next to the .nupkg is pushed to the nuget.org symbol server automatically.
      - name: Push to nuget.org
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      # GitHub Packages has no symbol server.
      - name: Push to GitHub Packages
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key ${{ secrets.GITHUB_TOKEN }}
          --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
          --skip-duplicate
          --no-symbols

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          if [[ "$VERSION" == *-* ]]; then prerelease="--prerelease"; fi
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" artifacts/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" artifacts/* \
              --verify-tag --title "$GITHUB_REF_NAME" --generate-notes $prerelease
          fi
